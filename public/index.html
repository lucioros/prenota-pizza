<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prenota la Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><span class="label">Ordina da asporto</span><b id="brand">…</b></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty" style="margin-top:24px">Carico il listino…</div></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
<script>
const TOTEM = params.get('totem') === '1';
let P = null, formati = [], impasti = [], ingr = [], pizze = [];
let cart = [], B = null, done = null, cliente = { nome: '', tel: '', quando: '' }, errore = '', inviando = false;
let pagScelta = 'online', ritorno = null;
// fedeltà: scheda del cliente trovata dal telefono e scelte fatte nel carrello
let scheda = null, schedaTel = '', fid = { salva: true, consenso: false, consensoToccato: false, codice: '', amico: params.get('invito') || '', usaPremio: false };
let stimaRes = null, stimaSeq = 0, ultimo = TOTEM ? null : lsGet('pz_ultimo_' + SLUG), statoUltimo = null;

// come paga il cliente: al totem sempre alla cassa, senza Stripe attivo solo al ritiro
const modoPag = () => (TOTEM || !P.pagamenti_attivi) ? 'no' : P.pagamento_online;
const pagaOnline = () => modoPag() === 'obbligatorio' || (modoPag() === 'facoltativo' && pagScelta === 'online');
// chiave segreta di questo telefono: dà accesso ai dati completi della tessera
const DEV = (() => { let t = lsGet('pz_dev'); if (!t || String(t).length < 32) { t = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join(''); lsSet('pz_dev', t); } return t; })();
const FED = () => P.fedelta || {};
const on = k => !!(FED()[k] && FED()[k].attivo);
const fedeltaAttiva = () => ['timbri', 'amico', 'cimanchi'].some(on);
const telValido = t => String(t || '').replace(/\D/g, '').length >= 8;
function perExtra() {
  const x = { dispositivo: DEV, salva: fid.salva, codice: fid.codice || null, codice_amico: fid.amico || null, usa_premio: fid.usaPremio };
  if (fid.consensoToccato) x.consenso = fid.consenso;
  return x;
}
const F = id => formati.find(f => f.id === id) || formati[0];
const IM = id => impasti.find(i => i.id === id);
const G = id => ingr.find(g => g.id === id);
const PZ = id => pizze.find(p => p.id === id);

// Prezzo mostrato al cliente: lo stesso calcolo lo rifà il database quando conferma
function prezzo(r) {
  const f = F(r.formato);
  let p = r.tipo === 'pers' ? +P.prezzo_base_pers : (+PZ(r.pizza)?.prezzo || 0);
  p += +f.supplemento || 0;
  const im = IM(r.impasto); if (im) p += +im.sovrapprezzo || 0;
  p += r.aggiunte.reduce((a, id) => a + (+G(id)?.prezzo || 0) * (+f.moltiplicatore_aggiunte), 0);
  return r2(Math.max(0, p));
}
const nomeRiga = r => r.tipo === 'pers' ? 'Pizza personalizzata' : (PZ(r.pizza)?.nome || 'Pizza');
const totale = rows => r2(rows.reduce((a, r) => a + prezzo(r) * r.qta, 0));
const perRpc = rows => rows.map(r => ({ tipo: r.tipo, pizza_id: r.pizza, formato_id: r.formato, impasto_id: r.impasto, qta: r.qta, aggiunte: r.aggiunte, tolti: r.tolti }));

async function carica() {
  const { data: p, error } = await sb.from('pizzerie').select('*').eq('slug', SLUG).maybeSingle();
  if (error || !p) { $('#main').innerHTML = `<div class="empty" style="margin-top:24px">${error ? esc(msgErr(error)) : 'Pizzeria non trovata. Controlla il link.'}</div>`; return; }
  P = p;
  const [f, i, g, z] = await Promise.all([
    sb.from('formati').select('*').eq('pizzeria_id', P.id).eq('attivo', true).order('ordine'),
    sb.from('impasti').select('*').eq('pizzeria_id', P.id).order('ordine'),
    sb.from('ingredienti').select('*').eq('pizzeria_id', P.id).order('ordine'),
    sb.from('pizze').select('*, pizza_ingredienti(ingrediente_id)').eq('pizzeria_id', P.id).eq('attiva', true).order('ordine')]);
  const err = [f, i, g, z].find(x => x.error);
  if (err) { toast(msgErr(err.error), true); return; }
  formati = f.data; impasti = i.data; ingr = g.data;
  pizze = z.data.map(p => ({ ...p, ingr: p.pizza_ingredienti.map(x => x.ingrediente_id) }));
  // tieni nel carrello solo ciò che esiste ancora
  cart = cart.filter(r => formati.some(f => f.id === r.formato) && (r.tipo === 'pers' || PZ(r.pizza)));
  render(); aggiornaStima(); controllaUltimo();
  if (!carica.fatto) { carica.fatto = true; gestisciRitorno(); }
}

function render() {
  if (!P) return;
  document.body.classList.toggle('totem', TOTEM);
  document.title = P.nome;
  $('#brand').textContent = P.nome;
  $('#tabs').innerHTML = TOTEM ? '' : `<a class="tab" href="gestione.html?p=${encodeURIComponent(SLUG)}">Area pizzeria</a>`;
  $('#main').innerHTML = vOrdina();
  renderModal();
}

function vOrdina() {
  const fam = formati.find(f => f.posti > 1);
  const lista = pizze.map(p => {
    const manca = p.ingr.some(id => !G(id)?.disponibile);
    return `<button class="pz" data-act="apri" data-tipo="listino" data-p="${p.id}" ${manca ? 'disabled' : ''}>
      <h3>${esc(p.nome)}</h3>
      <span class="ing">${esc(P.descrizione_base)}${p.ingr.length ? ', ' : ''}${p.ingr.map(id => esc(G(id)?.nome || '')).join(', ').toLowerCase()}</span>
      <span class="row">${manca ? '<span class="badge">Non disponibile oggi</span>' : `<span class="price">${eur(p.prezzo)}</span>`}
      ${!manca && fam ? `<span class="muted mono" style="font-size:12px">${esc(fam.nome)} ${eur(+p.prezzo + +fam.supplemento)}</span>` : ''}</span>
    </button>`;
  }).join('');
  const sv = servizio(P);
  return `<div class="order-grid">
    <section style="min-width:0">
      <h1 class="page-h">${sv.aperto ? 'Cosa vi prepariamo?' : 'Ordina ora, ritira quando apriamo'}</h1>
      <p class="muted" style="margin:0">${sv.aperto ? 'Scegli dal listino o componi la tua pizza. Ti diciamo subito a che ora passare a ritirarla.' : `Apriamo alle ${ora(sv.start)}${giorno(sv.start) ? ' di ' + esc(giorno(sv.start)) : ''}. Puoi già ordinare.`}</p>
      ${vOfferte()}
      <button class="create" data-act="apri" data-tipo="pers">
        <span class="plus">+</span>
        <span><h3>Crea la tua pizza</h3><span class="muted">${esc(P.descrizione_base)}, poi scegli impasto e ingredienti · da <span class="mono">${eur(P.prezzo_base_pers)}</span></span></span>
      </button>
      <h2 class="sec-h">Il listino</h2>
      <div class="cards">${lista || '<div class="empty">Il listino è vuoto.</div>'}</div>
    </section>
    <aside class="cart"><div id="track">${vUltimo()}</div>${vCarrello()}</aside>
  </div>`;
}

function vOfferte() {
  const f = FED(), out = [];
  const GG = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
  if (on('fasce')) (f.fasce.fasce || []).forEach(x => out.push(`−${x.perc}% se ritiri tra le ${x.da} e le ${x.a}`));
  if (on('timbri')) out.push(`Ogni ${f.timbri.soglia} pizze una in omaggio`);
  if (on('giorni_doppi') && (f.giorni_doppi.giorni || []).length) out.push(`Timbri doppi il ${f.giorni_doppi.giorni.map(g => GG[g]).join(' e il ')}`);
  if (on('amico')) out.push(`Porta un amico: ${eur(f.amico.sconto)} di sconto a lui e a te`);
  return out.length ? `<div class="offerte">${out.map(o => `<span class="offerta">${esc(o)}</span>`).join('')}</div>` : '';
}

function vUltimo() {
  if (!ultimo || !statoUltimo) return '';
  const nomi = { attesa_pagamento: 'In attesa di pagamento', ricevuto: 'Ricevuto', preparazione: 'In preparazione', pronto: 'Pronto, puoi passare!', ritirato: 'Ritirato', annullato: 'Annullato' };
  return `<div class="track ${statoUltimo.stato}"><span class="label">Il tuo ordine #${statoUltimo.numero}</span>
    <b>${nomi[statoUltimo.stato] || ''}</b><span class="muted">Ritiro alle <span class="mono">${ora(statoUltimo.ritiro)}</span> · ${eur(statoUltimo.totale)}${statoUltimo.pagato ? ' · pagato' : ''}</span></div>`;
}

function opzioniOra() {
  const sv = servizio(P);
  let t = Math.ceil((sv.start + 30 * MIN) / (15 * MIN)) * 15 * MIN, out = '';
  while (t <= sv.close) { out += `<option value="${t}" ${String(t) === cliente.quando ? 'selected' : ''}>${ora(t)}${giorno(t) ? ' · ' + giorno(t) : ''}</option>`; t += 15 * MIN; }
  return out;
}
function vCarrello() {
  const righe = cart.map((r, i) => {
    const f = F(r.formato), im = IM(r.impasto);
    const det = [f.nome, im && +im.sovrapprezzo ? 'impasto ' + im.nome.toLowerCase() : '',
      r.aggiunte.length ? '+ ' + r.aggiunte.map(id => G(id)?.nome).join(', ').toLowerCase() : '',
      r.tolti.length ? 'senza ' + r.tolti.map(id => G(id)?.nome).join(', ').toLowerCase() : ''].filter(Boolean).join(' · ');
    return `<li class="line"><span class="t">${r.qta}× ${esc(nomeRiga(r))}</span><span class="p">${eur(prezzo(r) * r.qta)}</span>
      <span class="d">${esc(det)}</span><button class="x" data-act="togli" data-i="${i}">Togli</button></li>`;
  }).join('');
  return `<h2>Il tuo ordine</h2>
    ${cart.length ? `<ul class="lines">${righe}</ul><div class="tot"><span>Totale</span><span class="mono">${eur(totale(cart))}</span></div>`
      : `<p class="muted" style="margin:0">Ancora vuoto. Tocca una pizza per aggiungerla.</p>`}
    <div class="field"><label class="label" for="c-nome">Nome per il ritiro</label><input id="c-nome" data-c="nome" value="${esc(cliente.nome)}" autocomplete="given-name" maxlength="60"></div>
    ${TOTEM && !fedeltaAttiva() ? '' : `<div class="field"><label class="label" for="c-tel">${fedeltaAttiva() ? 'Telefono, per timbri e offerte (facoltativo)' : 'Telefono (facoltativo)'}</label><input id="c-tel" data-c="tel" type="tel" inputmode="tel" value="${esc(cliente.tel)}" autocomplete="tel" maxlength="30" placeholder="333 123 4567"></div>`}
    <div id="fid-info">${vFid()}</div>
    ${on('codici') || on('amico') ? `<div class="codes">
      ${on('codici') ? `<div class="field"><label class="label" for="c-codice">Codice sconto</label><input id="c-codice" data-f="codice" value="${esc(fid.codice)}" autocapitalize="characters" maxlength="20"></div>` : ''}
      ${on('amico') ? `<div class="field"><label class="label" for="c-amico">Codice di un amico</label><input id="c-amico" data-f="amico" value="${esc(fid.amico)}" autocapitalize="characters" maxlength="10" placeholder="solo al primo ordine"></div>` : ''}
    </div>` : ''}
    <div class="field"><label class="label" for="c-quando">Quando passi?</label>
      <select id="c-quando" data-c="quando"><option value="">Appena pronta</option>${opzioniOra()}</select></div>
    ${vPagamento()}
    <div id="stima">${vStima()}</div>
    ${errore ? `<span class="err-msg">${esc(errore)}</span>` : ''}
    <button class="primary" data-act="conferma" ${cart.length && !inviando ? '' : 'disabled'}>${inviando ? (pagaOnline() ? 'Ti porto al pagamento…' : 'Invio in corso…') : pagaOnline() ? 'Vai al pagamento' : 'Conferma ordine'}</button>`;
}
// Scheda fedeltà: cambia quando cambia il telefono
function vFid() {
  if (!fedeltaAttiva() || !telValido(cliente.tel)) return '';
  if (!scheda || schedaTel !== cliente.tel) return '<span class="muted" style="font-size:13px">Cerco la tua scheda…</span>';
  const f = FED();
  const consenso = `<label class="check"><input type="checkbox" id="c-consenso" data-chk="consenso" ${fid.consenso ? 'checked' : ''}> Voglio ricevere offerte e novità su WhatsApp</label>`;
  if (scheda.trovato && !scheda.fiducia) {
    return `<div class="fid">
      <div class="top"><b>Numero riconosciuto</b>${on('timbri') ? `<span class="mono">${scheda.timbri}/${scheda.soglia} timbri</span>` : ''}</div>
      <span class="muted" style="font-size:13px">Per proteggere i tuoi dati, nome, premi e "la mia solita" si vedono solo dal telefono con cui ti sei registrato. I timbri di questo ordine si sommano comunque. Questo telefono si abilita da solo quando ritiri l'ordine in pizzeria.</span>
    </div>`;
  }
  if (scheda.trovato) {
    const tot = scheda.soglia, n = Math.min(scheda.timbri, tot);
    const puo = on('timbri') && scheda.timbri >= tot;
    return `<div class="fid">
      <div class="top"><b>Ciao ${esc(scheda.nome)}!</b>${on('timbri') ? `<span class="mono">${scheda.timbri}/${tot} timbri</span>` : ''}</div>
      ${on('timbri') ? `<div class="stamps" aria-hidden="true">${Array.from({ length: Math.min(tot, 20) }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>` : ''}
      ${puo ? `<button class="chip" data-act="premio" aria-pressed="${fid.usaPremio}">${fid.usaPremio ? '✓ ' : ''}Usa la pizza omaggio</button>` : ''}
      ${+scheda.credito > 0 ? `<span class="muted" style="font-size:13px">Hai ${eur(scheda.credito)} di credito per gli amici invitati: lo usi su questo ordine.</span>` : ''}
      ${scheda.solita && scheda.solita.length ? `<button class="ghost" data-act="solita">Riordina la tua solita (${scheda.solita.map(r => r.qta + '× ' + esc(r.nome)).join(', ')})</button>` : ''}
      ${!scheda.consenso ? consenso : ''}
    </div>`;
  }
  return `<div class="fid">
    <label class="check"><input type="checkbox" id="c-salva" data-chk="salva" ${fid.salva ? 'checked' : ''}> Salva il mio numero per ${on('timbri') ? 'raccogliere timbri e ' : ''}ricevere i vantaggi</label>
    ${fid.salva ? consenso : ''}
    <span class="muted" style="font-size:12px">Usiamo il numero solo per riconoscerti e, se lo scegli, per scriverti su WhatsApp. Puoi chiedere di cancellarlo quando vuoi.</span>
  </div>`;
}
let schedaTimer;
function cercaScheda() {
  clearTimeout(schedaTimer);
  if (!fedeltaAttiva() || !telValido(cliente.tel)) { scheda = null; const el = $('#fid-info'); if (el) el.innerHTML = vFid(); return; }
  schedaTimer = setTimeout(async () => {
    const tel = cliente.tel;
    const { data } = await sb.rpc('scheda_fedelta', { p_pizzeria: P.id, p_telefono: tel, p_dispositivo: DEV });
    if (tel !== cliente.tel) return;
    scheda = data || { trovato: false }; schedaTel = tel; fid.usaPremio = false;
    const el = $('#fid-info'); if (el) el.innerHTML = vFid();
    aggiornaStima();
  }, 400);
}
function vPagamento() {
  const m = modoPag();
  if (m === 'no') return '';
  if (m === 'obbligatorio') return `<div class="field"><span class="label">Pagamento</span><span class="muted" style="font-size:14px">Paghi online al momento dell'ordine: carta, PayPal, Apple Pay o Google Pay.</span></div>`;
  return `<div class="field"><span class="label">Come vuoi pagare?</span><div class="seg">
    <button class="opt" data-act="paga" data-v="online" aria-pressed="${pagScelta === 'online'}">Paga ora<small>carta o PayPal</small></button>
    <button class="opt" data-act="paga" data-v="al_ritiro" aria-pressed="${pagScelta === 'al_ritiro'}">Al ritiro<small>in pizzeria</small></button></div></div>`;
}
function vStima() {
  if (!cart.length) return `<div class="stima"><span class="label">Orario di ritiro</span><span class="muted">Compare qui appena aggiungi una pizza.</span></div>`;
  const e = stimaRes;
  if (!e) return `<div class="stima"><span class="label">Ritiro previsto</span><span class="muted">Calcolo in corso…</span></div>`;
  if (e.err) return `<div class="stima err">${esc(e.err)}</div>`;
  return `<div class="stima ${e.oltre_chiusura ? 'err' : ''}"><span class="label">Ritiro previsto</span>
    <span class="ora">${ora(e.ritiro)}</span>
    <span class="muted" style="font-size:13px">${giorno(e.ritiro) ? esc(giorno(e.ritiro)) + ' · ' : ''}${e.pizze_davanti ? `${e.pizze_davanti} pizze in coda prima delle tue` : 'Il forno è libero'}</span>
    ${e.oltre_chiusura ? '<span style="font-size:13px">Oltre l\'orario di chiusura: prova con meno pizze.</span>' : ''}</div>
    ${(e.sconti && e.sconti.length) || (e.avvisi && e.avvisi.length) || e.timbri_guadagnati ? `<div class="sconti">
      ${(e.sconti || []).map(x => `<div class="sc"><span>${esc(x.descrizione)}</span><span class="mono">−${eur(x.importo)}</span></div>`).join('')}
      ${e.sconti && e.sconti.length ? `<div class="sc tot"><span>Da pagare</span><span class="mono"><s class="muted">${eur(e.totale_lordo)}</s> ${eur(e.totale)}</span></div>` : ''}
      ${(e.avvisi || []).map(a => `<span class="avviso">${esc(a)}</span>`).join('')}
      ${e.timbri_guadagnati ? `<span class="muted" style="font-size:13px">Con questo ordine guadagni ${e.timbri_guadagnati} timbri</span>` : ''}
    </div>` : ''}`;
}
// L'orario lo calcola il database guardando tutti gli ordini già in coda
let stimaTimer;
function aggiornaStima() {
  clearTimeout(stimaTimer);
  if (!cart.length) { stimaRes = null; const el = $('#stima'); if (el) el.innerHTML = vStima(); return; }
  stimaTimer = setTimeout(async () => {
    const seq = ++stimaSeq;
    const { data, error } = await sb.rpc('stima_ordine', { p_pizzeria: P.id, p_righe: perRpc(cart), p_preferito: cliente.quando ? new Date(+cliente.quando).toISOString() : null,
      p_extra: { ...perExtra(), telefono: cliente.tel || null } });
    if (seq !== stimaSeq) return;
    stimaRes = error ? { err: msgErr(error) } : data;
    const el = $('#stima'); if (el) el.innerHTML = vStima();
  }, 400);
}
async function controllaUltimo() {
  if (!ultimo) return;
  const { data } = await sb.rpc('stato_ordine', { p_ordine: ultimo.id });
  if (!data || ['ritirato', 'annullato'].includes(data.stato) && Date.now() - new Date(data.ritiro) > 30 * MIN || Date.now() - new Date(data.ritiro) > 6 * 3600000) {
    ultimo = null; statoUltimo = null; lsSet('pz_ultimo_' + SLUG, null);
  } else statoUltimo = data;
  const tr = $('#track'); if (tr) tr.innerHTML = vUltimo();
}

function vDoneFid() {
  const c = done && done.cliente; if (!c) return '';
  const f = FED(), parti = [];
  if (on('timbri')) parti.push(`<span class="mono">${c.timbri}/${c.soglia}</span> timbri sulla tua tessera`);
  let invito = '';
  if (on('amico') && c.codice_invito && !TOTEM) {
    const link = `${location.origin}${location.pathname}?p=${encodeURIComponent(SLUG)}&invito=${c.codice_invito}`;
    const msg = `Ordina da ${P.nome} con il mio codice ${c.codice_invito}: hai ${eur(f.amico.sconto)} di sconto sul primo ordine! ${link}`;
    invito = `<div class="invito"><span class="label">Il tuo codice amico</span><span class="mono" style="font-size:22px">${esc(c.codice_invito)}</span>
      <span class="muted" style="font-size:13px">Chi ordina con il tuo codice ha ${eur(f.amico.sconto)} di sconto, e tu ricevi ${eur(f.amico.sconto)} di credito quando ritira.</span>
      <a class="ghost" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Invialo su WhatsApp</a></div>`;
  }
  return (parti.length ? `<span class="muted">${parti.join(' · ')}</span>` : '') + invito;
}
function renderModal() {
  const m = $('#modal');
  if (ritorno) {
    m.innerHTML = `<div class="overlay"><div class="done" role="dialog" aria-label="Pagamento">
      ${ritorno.attesa ? `<span class="label">Pagamento</span><span class="ora">Sto verificando il pagamento…</span><span class="muted">Ci vuole qualche secondo.</span>`
      : `<span class="label">Pagamento non completato</span><span class="ora">Ordine #${ritorno.numero} non confermato</span>
      <span class="muted">${esc(ritorno.msg || 'Non hai completato il pagamento. Puoi riprovare: il posto nel forno resta tenuto per qualche minuto.')}</span>
      <button class="primary" data-act="ripaga" style="margin-top:8px">Riprova a pagare</button>
      <button class="ghost" data-act="chiudiRitorno">Chiudi</button>`}</div></div>`; return;
  }
  if (done) {
    m.innerHTML = `<div class="overlay"><div class="done" role="dialog" aria-label="Ordine confermato">
      <span class="label">Ordine confermato</span><span class="num">${done.numero}</span>
      <span class="muted">Grazie${done.nome ? ' ' + esc(done.nome) : ''}, passa a ritirare alle</span>
      <span class="ora">${ora(done.ritiro)}${giorno(done.ritiro) ? ' · ' + esc(giorno(done.ritiro)) : ''}</span>
      <span class="muted">${done.pagato ? 'Pagato online' : 'Totale da pagare al ritiro'}: <span class="mono">${eur(done.totale)}</span></span>
      ${vDoneFid()}
      ${TOTEM ? '<span class="muted" style="font-size:13px">Ricorda il numero: ti chiamiamo con questo.</span>' : '<span class="muted" style="font-size:13px">Puoi seguire lo stato del tuo ordine da questa pagina.</span>'}
      <button class="primary" data-act="nuovo" style="margin-top:8px">${TOTEM ? 'Fine' : 'Chiudi'}</button></div></div>`; return;
  }
  if (!B) { m.innerHTML = ''; return; }
  const pz = B.tipo === 'listino' ? PZ(B.pizza) : null;
  const fOpt = formati.map(f => `<button class="opt" data-act="b" data-k="formato" data-v="${f.id}" aria-pressed="${B.formato === f.id}">${esc(f.nome)}<small>${eur(prezzo({ ...B, formato: f.id }))} · ~${f.minuti} min</small></button>`).join('');
  const iOpt = impasti.filter(i => i.disponibile).map(i => `<button class="opt" data-act="b" data-k="impasto" data-v="${i.id}" aria-pressed="${B.impasto === i.id}">${esc(i.nome)}<small>${+i.sovrapprezzo ? '+ ' + eur(i.sovrapprezzo) : 'incluso'}</small></button>`).join('');
  const f = F(B.formato), base = pz ? pz.ingr : [];
  const inclusi = base.map(id => `<button class="chip ${B.tolti.includes(id) ? 'off' : ''}" data-act="tolto" data-g="${id}">${esc(G(id)?.nome)}</button>`).join('');
  const cats = [...new Set([...CATS, ...ingr.map(g => g.categoria)])];
  const gruppi = cats.map(c => {
    const gs = ingr.filter(g => g.categoria === c && !base.includes(g.id));
    if (!gs.length) return '';
    return `<div class="grp"><span class="label">${esc(c)}</span><div class="chips">${gs.map(g => `<button class="chip" data-act="agg" data-g="${g.id}" aria-pressed="${B.aggiunte.includes(g.id)}" ${g.disponibile ? '' : 'disabled'}>${esc(g.nome)}<small>${g.disponibile ? '+' + eur(g.prezzo * f.moltiplicatore_aggiunte) : 'finito'}</small></button>`).join('')}</div></div>`;
  }).join('');
  m.innerHTML = `<div class="overlay" data-act="fuori"><div class="sheet" role="dialog" aria-label="Componi la pizza">
    <div class="sheet-h"><div><span class="label">${pz ? 'Dal listino' : 'Crea la tua pizza'}</span><h2>${esc(pz ? pz.nome : 'La tua pizza')}</h2>
      <span class="muted">${esc(P.descrizione_base)}${pz && pz.ingr.length ? ', ' + pz.ingr.map(id => esc(G(id)?.nome)).join(', ').toLowerCase() : ''}</span></div>
      <button class="close" data-act="chiudi" aria-label="Chiudi">×</button></div>
    <div class="sheet-b">
      <div class="grp"><span class="label">Formato</span><div class="seg">${fOpt}</div></div>
      ${iOpt ? `<div class="grp"><span class="label">Impasto</span><div class="seg">${iOpt}</div></div>` : ''}
      ${base.length ? `<div class="grp"><span class="label">Ingredienti inclusi · tocca per toglierli</span><div class="chips">${inclusi}</div></div>` : ''}
      <div class="grp"><span class="label">${pz ? 'Aggiungi' : 'Scegli gli ingredienti'}</span>${gruppi}</div>
    </div>
    <div class="sheet-f">
      <div class="step"><button data-act="qta" data-d="-1" aria-label="Meno">−</button><span>${B.qta}</span><button data-act="qta" data-d="1" aria-label="Più">+</button></div>
      <span class="mono" style="font-size:18px">${eur(prezzo(B) * B.qta)}</span>
      <button class="primary" data-act="aggiungi">Aggiungi all'ordine</button>
    </div></div></div>`;
}

let totemTimer = null;
// Porta il cliente sulla pagina di pagamento sicura di Stripe
async function vaiAlPagamento(id, numero) {
  const { data, error } = await invoca('pagamento-checkout', { ordine_id: id });
  if (data && data.url) { location.href = data.url; return true; }
  ritorno = { id, numero: numero || ritorno?.numero || '', msg: error || 'Non riesco ad aprire la pagina di pagamento.' };
  render(); return false;
}
// Ritorno da Stripe: ?pagamento=ok|annullato&ordine=…
async function gestisciRitorno() {
  const esito = params.get('pagamento'), id = params.get('ordine');
  if (!esito || !id) return;
  history.replaceState(null, '', location.pathname + '?p=' + encodeURIComponent(SLUG));
  ultimo = { id }; lsSet('pz_ultimo_' + SLUG, ultimo);
  if (esito === 'ok') {
    ritorno = { id, attesa: true }; render();
    // la conferma arriva da Stripe al database: aspetto qualche secondo
    for (let i = 0; i < 15; i++) {
      const { data } = await sb.rpc('stato_ordine', { p_ordine: id });
      if (data && data.stato !== 'attesa_pagamento') {
        ritorno = null; statoUltimo = data;
        done = { ...data, nome: cliente.nome || '' }; render(); return;
      }
      await new Promise(r => setTimeout(r, 2000));
    }
    ritorno = null; render(); toast('Il pagamento è in verifica: lo stato dell\'ordine si aggiorna da solo.'); controllaUltimo();
  } else {
    const { data } = await sb.rpc('stato_ordine', { p_ordine: id });
    if (data && data.stato === 'attesa_pagamento') { ritorno = { id, numero: data.numero }; render(); }
  }
}
const ACT = {
  paga: d => { pagScelta = d.v; render(); },
  premio: () => { fid.usaPremio = !fid.usaPremio; $('#fid-info').innerHTML = vFid(); aggiornaStima(); },
  solita: () => {
    const imp = impasti.find(i => i.disponibile);
    let saltate = 0;
    for (const r of scheda.solita) {
      if (!formati.some(f => f.id === r.formato_id) || (r.tipo === 'listino' && !PZ(r.pizza_id))) { saltate++; continue; }
      cart.push({ tipo: r.tipo, pizza: r.pizza_id, formato: r.formato_id, impasto: impasti.some(i => i.id === r.impasto_id && i.disponibile) ? r.impasto_id : (imp ? imp.id : null),
        aggiunte: (r.aggiunte || []).filter(id => G(id)?.disponibile), tolti: r.tolti || [], qta: r.qta });
    }
    stimaRes = null; render(); aggiornaStima();
    toast(saltate ? 'Aggiunta la tua solita (alcune pizze non sono più in listino)' : 'Aggiunta la tua solita');
  },
  ripaga: () => vaiAlPagamento(ritorno.id),
  chiudiRitorno: () => { ritorno = null; render(); controllaUltimo(); },
  apri: d => { if (!formati.length) { toast('La pizzeria non ha ancora impostato i formati', true); return; }
    const imp = impasti.find(i => i.disponibile);
    B = { tipo: d.tipo, pizza: d.p || null, formato: formati[0].id, impasto: imp ? imp.id : null, aggiunte: [], tolti: [], qta: 1 }; renderModal(); },
  chiudi: () => { B = null; renderModal(); },
  fuori: (d, el, e) => { if (e.target === el) { B = null; renderModal(); } },
  b: d => { B[d.k] = d.v; renderModal(); },
  agg: d => { B.aggiunte = B.aggiunte.includes(d.g) ? B.aggiunte.filter(x => x !== d.g) : [...B.aggiunte, d.g]; renderModal(); },
  tolto: d => { B.tolti = B.tolti.includes(d.g) ? B.tolti.filter(x => x !== d.g) : [...B.tolti, d.g]; renderModal(); },
  qta: d => { B.qta = Math.max(1, Math.min(20, B.qta + +d.d)); renderModal(); },
  aggiungi: () => { cart.push(B); B = null; errore = ''; stimaRes = null; render(); aggiornaStima(); toast('Aggiunta all\'ordine'); },
  togli: d => { cart.splice(+d.i, 1); stimaRes = null; render(); aggiornaStima(); },
  conferma: async () => {
    if (!cliente.nome.trim()) { errore = 'Scrivi un nome, così ti chiamiamo al ritiro.'; render(); $('#c-nome')?.focus(); return; }
    inviando = true; errore = ''; render();
    const online = pagaOnline();
    const { data, error } = await sb.rpc('invia_ordine', { p_pizzeria: P.id, p_nome: cliente.nome.trim(), p_righe: perRpc(cart),
      p_telefono: cliente.tel.trim() || null, p_canale: TOTEM ? 'totem' : 'web',
      p_preferito: cliente.quando ? new Date(+cliente.quando).toISOString() : null, p_pagamento: online ? 'online' : 'al_ritiro',
      p_extra: perExtra() });
    if (error) { inviando = false; errore = msgErr(error); render(); aggiornaStima(); return; }
    if (online && data.pagamento === 'online') {
      ultimo = { id: data.id }; lsSet('pz_ultimo_' + SLUG, ultimo);
      cart = []; stimaRes = null;
      const ok = await vaiAlPagamento(data.id, data.numero);
      inviando = false; if (!ok) render();
      return;
    }
    inviando = false;
    done = { ...data, nome: cliente.nome.trim() };
    if (!TOTEM) { ultimo = { id: data.id }; lsSet('pz_ultimo_' + SLUG, ultimo); statoUltimo = { numero: data.numero, stato: 'ricevuto', ritiro: data.ritiro, totale: data.totale }; }
    cart = []; cliente = { nome: TOTEM ? '' : cliente.nome, tel: TOTEM ? '' : cliente.tel, quando: '' }; stimaRes = null;
    fid = { ...fid, codice: '', amico: '', usaPremio: false, consensoToccato: false }; scheda = null; schedaTel = '';
    if (!TOTEM) cercaScheda();
    render();
    if (TOTEM) { clearTimeout(totemTimer); totemTimer = setTimeout(() => { done = null; render(); }, 20000); }
  },
  nuovo: () => { done = null; clearTimeout(totemTimer); render(); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) ACT[el.dataset.act]?.(el.dataset, el, e); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) { fid[t.dataset.f] = t.value.toUpperCase().trim(); aggiornaStima(); return; }
  if (!t.dataset.c) return;
  if (t.dataset.c === 'tel') { cliente.tel = t.value; cercaScheda(); return; }
  cliente[t.dataset.c] = t.value;
  if (t.dataset.c === 'quando') { stimaRes = null; $('#stima').innerHTML = vStima(); aggiornaStima(); }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset.chk) return;
  fid[t.dataset.chk] = t.checked;
  if (t.dataset.chk === 'consenso') fid.consensoToccato = true;
  if (t.dataset.chk === 'salva') { $('#fid-info').innerHTML = vFid(); }
  aggiornaStima();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && B) { B = null; renderModal(); } });
// ogni 30 secondi aggiorna la stima (la coda cambia) e lo stato dell'ultimo ordine
setInterval(() => { if (!P) return; aggiornaStima(); controllaUltimo(); }, 30000);
// ogni 5 minuti ricarica il listino (ingredienti finiti, prezzi cambiati)
setInterval(() => { const a = document.activeElement; if (!B && !done && !ritorno && !inviando && !(a && /INPUT|SELECT/.test(a.tagName))) carica(); }, 300000);
carica();
</script>
