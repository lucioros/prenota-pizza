<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prenota la Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><span class="brand-logo" id="logo" aria-hidden="true"></span><div class="brand-txt"><span class="label" id="modo">Ordina da asporto</span><b id="brand">…</b></div></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty" style="margin-top:24px">Carico il listino…</div></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="common.js"></script>
<script src="pizza-art.js"></script>
<script>
const TOTEM = params.get('totem') === '1';
// al tavolo: il QR sul tavolo apre ?p=…&tavolo=CODICE
const TAV_COD = params.get('tavolo'); let TAVOLO = null;
const CHIAVE_ULTIMO = 'pz_ultimo_' + SLUG + (TAV_COD ? '_tavolo' : '');
// ?segui=ID: il cliente del totem segue il suo ordine dal telefono
const SEGUI = params.get('segui');
if (SEGUI && /^[0-9a-f-]{36}$/i.test(SEGUI)) lsSet(CHIAVE_ULTIMO, { id: SEGUI });
let P = null, formati = [], impasti = [], ingr = [], pizze = [];
let cart = [], B = null, done = null, cliente = { nome: '', tel: '', quando: '' }, errore = '', inviando = false;
let pagScelta = 'online', ritorno = null;
// fedeltà: scheda del cliente trovata dal telefono e scelte fatte nel carrello
let scheda = null, schedaTel = '', fid = { salva: true, consenso: false, consensoToccato: false, codice: '', amico: params.get('invito') || '', usaPremio: false };
let stimaRes = null, stimaSeq = 0, ultimo = TOTEM ? null : (SEGUI ? { id: SEGUI } : lsGet(CHIAVE_ULTIMO)), statoUltimo = null, avvisi = false, ultimoAvviso = '';

// come paga il cliente: al totem sempre alla cassa, senza Stripe attivo solo al ritiro
const modoPag = () => (TOTEM || TAV_COD || !P.pagamenti_attivi) ? 'no' : P.pagamento_online;
const pagaOnline = () => modoPag() === 'obbligatorio' || (modoPag() === 'facoltativo' && pagScelta === 'online');
// chiave segreta di questo telefono: dà accesso ai dati completi della tessera
const DEV = (() => { let t = lsGet('pz_dev'); if (!t || String(t).length < 32) { t = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join(''); lsSet('pz_dev', t); } return t; })();
const FED = () => P.fedelta || {};
// al tavolo nessuna offerta: tessera e sconti sono personali, il tavolo ordina per più persone
const on = k => !TAV_COD && !!(FED()[k] && FED()[k].attivo);
const fedeltaAttiva = () => ['timbri', 'amico', 'cimanchi'].some(on);
const telValido = t => String(t || '').replace(/\D/g, '').length >= 8;
function perExtra() {
  const x = { dispositivo: DEV, salva: fid.salva, codice: fid.codice || null, codice_amico: fid.amico || null, usa_premio: fid.usaPremio };
  if (fid.consensoToccato) x.consenso = fid.consenso;
  return x;
}
const rossa = () => /pomodoro/i.test(P.descrizione_base || '');
const tag = g => g ? `<span class="ing-tag"><span class="ic" aria-hidden="true">${icona(g)}</span> ${esc(g.nome.toLowerCase())}</span>` : '';
const F = id => formati.find(f => f.id === id) || formati[0];
const IM = id => impasti.find(i => i.id === id);
const G = id => ingr.find(g => g.id === id);
const PZ = id => pizze.find(p => p.id === id);

// Prezzo mostrato al cliente: lo stesso calcolo lo rifà il database quando conferma
function prezzo(r) {
  const f = F(r.formato);
  let p = r.tipo === 'pers' ? +P.prezzo_base_pers : (+PZ(r.pizza)?.prezzo || 0);
  p += +f.supplemento || 0;
  const im = IM(r.impasto); if (im) p += +im.sovrapprezzo || 0;
  p += r.aggiunte.reduce((a, id) => a + (+G(id)?.prezzo || 0) * (+f.moltiplicatore_aggiunte), 0);
  // togliere un ingrediente della pizza ne scala il prezzo, se la pizzeria lo ha scelto
  if (P.sconto_tolti && r.tipo === 'listino') {
    const base = PZ(r.pizza)?.ingr || [];
    p -= r.tolti.filter(id => base.includes(id)).reduce((a, id) => a + (+G(id)?.prezzo || 0) * (+f.moltiplicatore_aggiunte), 0);
  }
  return r2(Math.max(0, p));
}
const nomeRiga = r => r.tipo === 'pers' ? 'Pizza personalizzata' : (PZ(r.pizza)?.nome || 'Pizza');
const totale = rows => r2(rows.reduce((a, r) => a + prezzo(r) * r.qta, 0));
// ingredienti effettivi di una riga: quelli della pizza, meno i tolti, più le aggiunte
const ingrRiga = r => [...(r.tipo === 'listino' ? (PZ(r.pizza)?.ingr || []).filter(id => !r.tolti.includes(id)) : []), ...r.aggiunte].map(G).filter(Boolean);
const perRpc = rows => rows.map(r => ({ tipo: r.tipo, pizza_id: r.pizza, formato_id: r.formato, impasto_id: r.impasto, qta: r.qta, aggiunte: r.aggiunte, tolti: r.tolti }));

async function carica() {
  const { data: p, error } = await sb.from('pizzerie').select('*').eq('slug', SLUG).maybeSingle();
  if (error || !p) { $('#main').innerHTML = `<div class="empty" style="margin-top:24px">${error ? esc(msgErr(error)) : 'Pizzeria non trovata. Controlla il link.'}</div>`; return; }
  P = p;
  if (TAV_COD && !TAVOLO) {
    const t = await sb.rpc('tavolo_info', { p_pizzeria: P.id, p_codice: TAV_COD });
    if (!t.data) { $('#brand').textContent = P.nome; $('#main').innerHTML = '<div class="empty" style="margin-top:24px">Questo tavolo non è attivo per gli ordini dal telefono. Chiedi pure al personale.</div>'; return; }
    TAVOLO = t.data.nome;
  }
  const [f, i, g, z] = await Promise.all([
    sb.from('formati').select('*').eq('pizzeria_id', P.id).eq('attivo', true).order('ordine'),
    sb.from('impasti').select('*').eq('pizzeria_id', P.id).order('ordine'),
    sb.from('ingredienti').select('*').eq('pizzeria_id', P.id).order('ordine'),
    sb.from('pizze').select('*, pizza_ingredienti(ingrediente_id)').eq('pizzeria_id', P.id).eq('attiva', true).order('ordine')]);
  const err = [f, i, g, z].find(x => x.error);
  if (err) { toast(msgErr(err.error), true); return; }
  formati = f.data; impasti = i.data; ingr = g.data;
  pizze = z.data.map(p => ({ ...p, ingr: p.pizza_ingredienti.map(x => x.ingrediente_id) }));
  // tieni nel carrello solo ciò che esiste ancora
  cart = cart.filter(r => formati.some(f => f.id === r.formato) && (r.tipo === 'pers' || PZ(r.pizza)));
  render(); aggiornaStima(); controllaUltimo();
  if (!carica.fatto) { carica.fatto = true; gestisciRitorno(); }
}

function render() {
  if (!P) return;
  document.body.classList.toggle('totem', TOTEM);
  document.title = P.nome;
  $('#brand').textContent = P.nome;
  $('#logo').innerHTML = pizzaSVG([{ nome: 'Basilico' }], { seme: 'logo' });
  $('#modo').textContent = TAV_COD ? 'Ordina al tavolo · ' + TAVOLO : TOTEM ? 'Ordina qui' : 'Ordina da asporto';
  $('#tabs').innerHTML = TOTEM || TAV_COD ? '' : `<a class="tab" href="gestione.html?p=${encodeURIComponent(SLUG)}">Area pizzeria</a>`;
  $('#main').innerHTML = vOrdina();
  renderModal();
}

function vOrdina() {
  const fam = formati.find(f => f.posti > 1);
  const lista = pizze.map(p => {
    const manca = p.ingr.some(id => !G(id)?.disponibile);
    return `<button class="pz" data-act="apri" data-tipo="listino" data-p="${p.id}" ${manca ? 'disabled' : ''}>
      ${pizzaSVG(p.ingr.map(G), { seme: p.id, rossa: rossa(), titolo: p.nome })}
      <h3>${esc(p.nome)}</h3>
      <span class="ing">${p.ingr.length ? p.ingr.map(id => tag(G(id))).join('') : `<span class="muted">${esc(P.descrizione_base)}</span>`}</span>
      <span class="row">${manca ? '<span class="badge">Non disponibile oggi</span>' : `<span class="price">${eur(p.prezzo)}</span>`}
      ${!manca && fam ? `<span class="muted mono" style="font-size:12px">${esc(fam.nome)} ${eur(+p.prezzo + +fam.supplemento)}</span>` : ''}</span>
    </button>`;
  }).join('');
  const g0 = giorniRitiro()[0], sv = g0 ? { aperto: g0.open <= Date.now(), start: g0.open } : { aperto: false, start: Date.now() };
  return `<div class="order-grid">
    <section style="min-width:0">
      <div class="hero"><div>
      ${TAV_COD ? `<h1 class="page-h">Benvenuti! Ordinate dal tavolo</h1>
      <p class="muted" style="margin:0">Siete al <b>${esc(TAVOLO)}</b>. Scegliete le pizze: appena sono pronte ve le portiamo noi. Si paga alla cassa.</p>` : `
      <h1 class="page-h">${sv.aperto ? 'Cosa vi prepariamo?' : 'Ordina ora, ritira quando apriamo'}</h1>
      <p class="muted" style="margin:0">${sv.aperto ? 'Scegli dal listino o componi la tua pizza. Ti diciamo subito a che ora passare a ritirarla.' : `Apriamo alle ${ora(sv.start)}${giorno(sv.start) ? ' di ' + esc(giorno(sv.start)) : ''}. Puoi già ordinare.`}</p>`}
      </div>${pizze.length ? pizzaSVG(pizze[0].ingr.map(G), { seme: 'hero' + pizze[0].id, rossa: rossa(), titolo: pizze[0].nome }) : ''}</div>
      ${vOfferte()}
      <button class="create" data-act="apri" data-tipo="pers">
        ${pizzaSVG([], { seme: 'base', rossa: rossa(), titolo: 'Pizza da comporre' })}
        <span><h3>Crea la tua pizza</h3><span class="muted">${esc(P.descrizione_base)}, poi scegli impasto e ingredienti · da <span class="mono">${eur(P.prezzo_base_pers)}</span></span></span>
      </button>
      <h2 class="sec-h">Il listino</h2>
      <div class="cards">${lista || '<div class="empty">Il listino è vuoto.</div>'}</div>
    </section>
    <aside class="cart"><div id="track">${vUltimo()}</div>${vCarrello()}</aside>
  </div>`;
}

function vOfferte() {
  const f = FED(), out = [];
  const GG = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
  if (on('fasce')) (f.fasce.fasce || []).forEach(x => out.push(`−${x.perc}% se ritiri tra le ${x.da} e le ${x.a}`));
  if (on('timbri')) out.push(`Ogni ${f.timbri.soglia} pizze una in omaggio`);
  if (on('giorni_doppi') && (f.giorni_doppi.giorni || []).length) out.push(`Timbri doppi il ${f.giorni_doppi.giorni.map(g => GG[g]).join(' e il ')}`);
  if (on('amico')) out.push(`Porta un amico: ${eur(f.amico.sconto)} di sconto a lui e a te`);
  return out.length ? `<div class="offerte">${out.map(o => `<span class="offerta">${esc(o)}</span>`).join('')}</div>` : '';
}

// Messaggio sul turno: quante pizze mancano, se la pizzeria sta già lavorando a quelle prima
function messaggioTurno(s) {
  const tav = s.canale === 'tavolo';
  if (s.stato === 'attesa_pagamento') return { tit: 'In attesa di pagamento', txt: 'Completa il pagamento per entrare nel turno.' };
  if (s.stato === 'ricevuto') {
    if (!s.ordini_davanti) return { tit: 'Sei il prossimo!', txt: 'Le tue pizze entrano in lavorazione a momenti.' };
    return { tit: `Mancano ${s.pizze_davanti} ${+s.pizze_davanti === 1 ? 'pizza' : 'pizze'} prima delle tue`,
      txt: s.in_lavorazione_davanti ? 'La pizzeria sta già preparando le pizze prima delle tue.' : `Prima di te ${s.ordini_davanti === 1 ? 'c\'è 1 ordine' : `ci sono ${s.ordini_davanti} ordini`}.` };
  }
  if (s.stato === 'preparazione') return { tit: 'Le tue pizze sono in preparazione', txt: tav ? 'Tra poco arrivano al tavolo.' : 'Tra poco sono pronte.' };
  if (s.stato === 'pronto') return { tit: tav ? 'Pronte! Arrivano al tavolo' : 'Pronte! Puoi passare a ritirarle', txt: '' };
  if (s.stato === 'ritirato') return { tit: tav ? 'Servito. Buon appetito!' : 'Ritirato. Buon appetito!', txt: '' };
  return { tit: 'Ordine annullato', txt: '' };
}
function vTurno(s) {
  const m = messaggioTurno(s), passi = ['ricevuto', 'preparazione', 'pronto'];
  const idx = s.stato === 'ritirato' ? 3 : Math.max(0, passi.indexOf(s.stato));
  return `<b>${esc(m.tit)}</b>${m.txt ? `<span class="muted">${esc(m.txt)}</span>` : ''}
    ${s.stato !== 'annullato' ? `<div class="passi" aria-hidden="true">${['Ricevuto', 'In preparazione', 'Pronto'].map((l, i) => `<span class="${i < idx ? 'fatto' : i === idx ? 'adesso' : ''}">${l}</span>`).join('')}</div>` : ''}`;
}
function vUltimo() {
  if (!ultimo || !statoUltimo) return '';
  const s = statoUltimo, tav = s.canale === 'tavolo';
  const puoAvvisare = 'Notification' in window && !avvisi && ['ricevuto', 'preparazione'].includes(s.stato);
  return `<div class="track ${s.stato}"><span class="label">Il tuo ordine #${s.numero}${s.tavolo ? ' · ' + esc(s.tavolo) : ''}</span>
    ${vTurno(s)}
    <span class="muted" style="font-size:13px">${tav ? 'Previsto verso le' : 'Ritiro alle'} <span class="mono">${ora(s.ritiro)}</span> · ${eur(s.totale)}${s.pagato ? ' · pagato' : ''}</span>
    ${puoAvvisare ? '<button class="ghost small" data-act="avvisami">🔔 Avvisami quando tocca a me e quando è pronta</button>' : avvisi ? '<span class="muted" style="font-size:12px">🔔 Ti avvisiamo qui, tieni aperta la pagina</span>' : ''}</div>`;
}
// avviso del telefono (se il cliente l'ha permesso) quando cambia qualcosa di importante
function avvisa(s) {
  const chiave = s.stato + (s.stato === 'ricevuto' && !s.ordini_davanti ? '-prossimo' : '');
  if (!ultimoAvviso) { ultimoAvviso = chiave; return; }
  if (chiave === ultimoAvviso) return;
  ultimoAvviso = chiave;
  const m = messaggioTurno(s);
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { }
  try { if (avvisi && Notification.permission === 'granted') new Notification(`${P.nome} · ordine #${s.numero}`, { body: m.tit + (m.txt ? '. ' + m.txt : '') }); } catch (e) { }
  document.title = '🍕 ' + m.tit;
}

// giorni in cui si può ritirare: da oggi fino ai giorni di anticipo, saltando i giorni di chiusura
function giorniRitiro() {
  const out = [], now = Date.now(), chiusi = P.giorni_chiusura || [];
  const dur = (((hm(P.chiusura, now) - hm(P.apertura, now)) % DAY) + DAY) % DAY || DAY;
  const oggi = new Date(); oggi.setHours(12, 0, 0, 0);
  for (let d = -1; d <= (+P.giorni_prenotazione || 0); d++) {
    const g = new Date(oggi.getTime() + d * DAY);
    if (chiusi.includes(g.getDay())) continue;
    const open = hm(P.apertura, g), close = open + dur;
    if (close <= now + 20 * MIN) continue;
    const da = Math.max(open, Math.ceil((now + 30 * MIN) / (15 * MIN)) * 15 * MIN);
    const k = `${g.getFullYear()}-${String(g.getMonth() + 1).padStart(2, '0')}-${String(g.getDate()).padStart(2, '0')}`;
    const lab = d === 0 ? 'Oggi' : d === 1 ? 'Domani' : d === -1 ? 'Stasera' : g.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
    out.push({ k, lab: lab.charAt(0).toUpperCase() + lab.slice(1), open, close, da });
  }
  return out;
}
function opzioniGiorno(gg) { return gg.map((g, i) => `<option value="${g.k}" ${(cliente.giorno || gg[0].k) === g.k ? 'selected' : ''}>${esc(g.lab)}</option>`).join(''); }
function opzioniOra() {
  const gg = giorniRitiro(); if (!gg.length) return '';
  const g = gg.find(x => x.k === cliente.giorno) || gg[0];
  const primo = g === gg[0];
  let t = Math.ceil(g.da / (15 * MIN)) * 15 * MIN, out = primo ? '<option value="">Appena pronta</option>' : '';
  while (t <= g.close) { out += `<option value="${t}" ${String(t) === cliente.quando ? 'selected' : ''}>${ora(t)}</option>`; t += 15 * MIN; }
  return out;
}
function vCarrello() {
  const righe = cart.map((r, i) => {
    const f = F(r.formato), im = IM(r.impasto);
    const det = [f.nome, im && +im.sovrapprezzo ? 'impasto ' + im.nome.toLowerCase() : '',
      r.aggiunte.length ? '+ ' + r.aggiunte.map(id => G(id)?.nome).join(', ').toLowerCase() : '',
      r.tolti.length ? 'senza ' + r.tolti.map(id => G(id)?.nome).join(', ').toLowerCase() : ''].filter(Boolean).join(' · ');
    return `<li class="line"><span class="t">${r.qta}× ${esc(nomeRiga(r))}</span><span class="p">${eur(prezzo(r) * r.qta)}</span>
      <span class="d">${esc(det)}</span><button class="x" data-act="togli" data-i="${i}">Togli</button>
      ${ingrRiga(r).length ? `<span class="ics" aria-hidden="true">${ingrRiga(r).map(icona).join(' ')}</span>` : ''}</li>`;
  }).join('');
  return `<h2>Il tuo ordine</h2>
    ${cart.length ? `<ul class="lines">${righe}</ul><div class="tot"><span>Totale</span><span class="mono">${eur(totale(cart))}</span></div>`
      : `<p class="muted" style="margin:0">Ancora vuoto. Tocca una pizza per aggiungerla.</p>`}
    <div class="field"><label class="label" for="c-nome">${TAV_COD ? 'Nome (facoltativo)' : 'Nome per il ritiro'}</label><input id="c-nome" data-c="nome" value="${esc(cliente.nome)}" autocomplete="given-name" maxlength="60"></div>
    ${TAV_COD ? '<p class="muted" style="margin:0;font-size:13px">Al tavolo non si raccolgono timbri e non valgono le offerte: sono personali, e un tavolo ordina per più persone.</p>' : ''}
    ${(TOTEM || TAV_COD) && !fedeltaAttiva() ? '' : `<div class="field"><label class="label" for="c-tel">${fedeltaAttiva() ? 'Telefono, per timbri e offerte (facoltativo)' : 'Telefono (facoltativo)'}</label><input id="c-tel" data-c="tel" type="tel" inputmode="tel" value="${esc(cliente.tel)}" autocomplete="tel" maxlength="30" placeholder="333 123 4567"></div>`}
    <div id="fid-info">${vFid()}</div>
    ${on('codici') || on('amico') ? `<div class="codes">
      ${on('codici') ? `<div class="field"><label class="label" for="c-codice">Codice sconto</label><input id="c-codice" data-f="codice" value="${esc(fid.codice)}" autocapitalize="characters" maxlength="20"></div>` : ''}
      ${on('amico') ? `<div class="field"><label class="label" for="c-amico">Codice di un amico</label><input id="c-amico" data-f="amico" value="${esc(fid.amico)}" autocapitalize="characters" maxlength="10" placeholder="solo al primo ordine"></div>` : ''}
    </div>` : ''}
    ${TAV_COD ? '' : (() => { const gg = giorniRitiro(); return gg.length ? `<div class="quando">
      <div class="field"><label class="label" for="c-giorno">Giorno del ritiro</label><select id="c-giorno" data-c="giorno">${opzioniGiorno(gg)}</select></div>
      <div class="field"><label class="label" for="c-quando">Ora</label><select id="c-quando" data-c="quando">${opzioniOra()}</select></div></div>`
      : '<div class="stima err">Al momento non ci sono giorni disponibili per il ritiro.</div>'; })()}
    ${vPagamento()}
    <div id="stima">${vStima()}</div>
    ${errore ? `<span class="err-msg">${esc(errore)}</span>` : ''}
    <button class="primary" data-act="conferma" ${cart.length && !inviando ? '' : 'disabled'}>${inviando ? (pagaOnline() ? 'Ti porto al pagamento…' : 'Invio in corso…') : pagaOnline() ? 'Vai al pagamento' : TAV_COD ? 'Invia l\'ordine in cucina' : 'Conferma ordine'}</button>`;
}
// Scheda fedeltà: cambia quando cambia il telefono
function vFid() {
  if (!fedeltaAttiva() || !telValido(cliente.tel)) return '';
  if (!scheda || schedaTel !== cliente.tel) return '<span class="muted" style="font-size:13px">Cerco la tua scheda…</span>';
  const f = FED();
  const consenso = `<label class="check"><input type="checkbox" id="c-consenso" data-chk="consenso" ${fid.consenso ? 'checked' : ''}> Voglio ricevere offerte e novità su WhatsApp</label>`;
  if (scheda.trovato && !scheda.fiducia && scheda.biometria) return vBio();
  if (scheda.trovato && !scheda.fiducia) {
    return `<div class="fid">
      <div class="top"><b>Numero riconosciuto</b>${on('timbri') ? `<span class="mono">${scheda.timbri}/${scheda.soglia} timbri</span>` : ''}</div>
      <span class="muted" style="font-size:13px">${on('solo_dispositivo')
        ? 'La tessera è legata al telefono con cui ti sei registrato: da questo telefono non raccogli timbri e non usi premi o sconti personali. Si abilita da solo quando ritiri di persona un ordine fatto da qui, oppure chiedilo in pizzeria.'

async function gestisciRitorno() {
  const esito = params.get('pagamento'), id = params.get('ordine');
  if (!esito || !id) return;
  history.replaceState(null, '', location.pathname + '?p=' + encodeURIComponent(SLUG));
  ultimo = { id }; lsSet(CHIAVE_ULTIMO, ultimo);
  if (esito === 'ok') {
    ritorno = { id, attesa: true }; render();
    // la conferma arriva da Stripe al database: aspetto qualche secondo
    for (let i = 0; i < 15; i++) {
      const { data } = await sb.rpc('stato_ordine', { p_ordine: id });
      if (data && data.stato !== 'attesa_pagamento') {
        ritorno = null; statoUltimo = data;
        done = { ...data, nome: cliente.nome || '' }; render(); return;
      }
      await new Promise(r => setTimeout(r, 2000));
    }
    ritorno = null; render(); toast('Il pagamento è in verifica: lo stato dell\'ordine si aggiorna da solo.'); controllaUltimo();
  } else {
    const { data } = await sb.rpc('stato_ordine', { p_ordine: id });
    if (data && data.stato === 'attesa_pagamento') { ritorno = { id, numero: data.numero }; render(); }
  }
}
const ACT = {
  paga: d => { pagScelta = d.v; render(); },
  premio: () => { fid.usaPremio = !fid.usaPremio; $('#fid-info').innerHTML = vFid(); aggiornaStima(); },
  tua: d => {
    const t = (scheda.pizze || [])[+d.i]; if (!t) return;
    const x = tuaRiga(t); if (!x.ok) return;
    cart.push(x.r); stimaRes = null; render(); aggiornaStima();
    toast(`Aggiunta: ${t.tipo === 'pers' ? 'la tua pizza' : t.nome}`);
  },
  bio: () => bio(),
  tutteTue: () => { tutteTue = !tutteTue; $('#fid-info').innerHTML = vFid(); },
  ripaga: () => vaiAlPagamento(ritorno.id),
  chiudiRitorno: () => { ritorno = null; render(); controllaUltimo(); },
  apri: d => { if (!formati.length) { toast('La pizzeria non ha ancora impostato i formati', true); return; }
    const imp = impasti.find(i => i.disponibile);
    B = { tipo: d.tipo, pizza: d.p || null, formato: formati[0].id, impasto: imp ? imp.id : null, aggiunte: [], tolti: [], qta: 1 }; renderModal(); },
  chiudi: () => { B = null; renderModal(); },
  fuori: (d, el, e) => { if (e.target === el) { B = null; renderModal(); } },
  b: d => { B[d.k] = d.v; renderModal(); },
  agg: d => { B.aggiunte = B.aggiunte.includes(d.g) ? B.aggiunte.filter(x => x !== d.g) : [...B.aggiunte, d.g]; renderModal(); },
  tolto: d => { B.tolti = B.tolti.includes(d.g) ? B.tolti.filter(x => x !== d.g) : [...B.tolti, d.g]; renderModal(); },
  qta: d => { B.qta = Math.max(1, Math.min(20, B.qta + +d.d)); renderModal(); },
  aggiungi: () => { cart.push(B); B = null; errore = ''; stimaRes = null; render(); aggiornaStima(); toast('Aggiunta all\'ordine'); },
  togli: d => { cart.splice(+d.i, 1); stimaRes = null; render(); aggiornaStima(); },
  conferma: async () => {
    if (!TAV_COD && !cliente.nome.trim()) { errore = 'Scrivi un nome, così ti chiamiamo al ritiro.'; render(); $('#c-nome')?.focus(); return; }
    inviando = true; errore = ''; render();
    const online = pagaOnline();
    const { data, error } = await sb.rpc('invia_ordine', { p_pizzeria: P.id, p_nome: cliente.nome.trim(), p_righe: perRpc(cart),
      p_telefono: cliente.tel.trim() || null, p_canale: TOTEM ? 'totem' : 'web',
      p_preferito: cliente.quando ? new Date(+cliente.quando).toISOString() : null, p_pagamento: online ? 'online' : 'al_ritiro',
      p_extra: TAV_COD ? { tavolo: TAV_COD } : perExtra() });
    if (error) { inviando = false; errore = msgErr(error); render(); aggiornaStima(); return; }
    if (online && data.pagamento === 'online') {
      ultimo = { id: data.id }; lsSet(CHIAVE_ULTIMO, ultimo);
      cart = []; stimaRes = null;
      const ok = await vaiAlPagamento(data.id, data.numero);
      inviando = false; if (!ok) render();
      return;
    }
    inviando = false;
    done = { ...data, nome: cliente.nome.trim() };
    if (!TOTEM) { ultimo = { id: data.id }; lsSet(CHIAVE_ULTIMO, ultimo); statoUltimo = null; ultimoAvviso = ''; }
    sb.rpc('stato_ordine', { p_ordine: data.id }).then(({ data: st }) => { if (st && done && done.id === data.id) { done.turno = st; const dt = $('#done-turno'); if (dt) dt.innerHTML = vTurno(st); } if (!TOTEM) controllaUltimo(); });
    cart = []; cliente = { nome: TOTEM ? '' : cliente.nome, tel: TOTEM ? '' : cliente.tel, quando: '' }; stimaRes = null;
    fid = { ...fid, codice: '', amico: '', usaPremio: false, consensoToccato: false }; scheda = null; schedaTel = '';
    if (!TOTEM) cercaScheda();
    render();
    if (TOTEM) { clearTimeout(totemTimer); totemTimer = setTimeout(() => { done = null; render(); }, 20000); }
  },
  nuovo: () => { done = null; clearTimeout(totemTimer); render(); },
  avvisami: async () => {
    try { const r = await Notification.requestPermission(); avvisi = r === 'granted'; } catch (e) { avvisi = false; }
    if (!avvisi) toast('Il telefono non permette gli avvisi: il turno si aggiorna comunque su questa pagina');
    const tr = $('#track'); if (tr) tr.innerHTML = vUltimo();
  },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) ACT[el.dataset.act]?.(el.dataset, el, e); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) { fid[t.dataset.f] = t.value.toUpperCase().trim(); aggiornaStima(); return; }
  if (!t.dataset.c) return;
  if (t.dataset.c === 'tel') { cliente.tel = t.value; cercaScheda(); return; }
  cliente[t.dataset.c] = t.value;
  if (t.dataset.c === 'giorno') {
    const gg = giorniRitiro(), primo = gg[0] && gg[0].k === t.value;
    cliente.quando = primo ? '' : String(Math.ceil((gg.find(x => x.k === t.value) || gg[0]).da / (15 * MIN)) * 15 * MIN);
    $('#c-quando').innerHTML = opzioniOra(); stimaRes = null; $('#stima').innerHTML = vStima(); aggiornaStima(); return;
  }
  if (t.dataset.c === 'quando') { stimaRes = null; $('#stima').innerHTML = vStima(); aggiornaStima(); }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset.chk) return;
  fid[t.dataset.chk] = t.checked;
  if (t.dataset.chk === 'consenso') fid.consensoToccato = true;
  if (t.dataset.chk === 'salva') { $('#fid-info').innerHTML = vFid(); }
  aggiornaStima();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && B) { B = null; renderModal(); } });
// ogni 30 secondi aggiorna la stima (la coda cambia) e lo stato dell'ultimo ordine
setInterval(() => { if (!P) return; aggiornaStima(); }, 30000);
// il turno si controlla più spesso
setInterval(() => { if (P) controllaUltimo(); }, 15000);
// ogni 5 minuti ricarica il listino (ingredienti finiti, prezzi cambiati)
setInterval(() => { const a = document.activeElement; if (!B && !done && !ritorno && !inviando && !(a && /INPUT|SELECT/.test(a.tagName))) carica(); }, 300000);
carica();
</script>
